<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>Live Minecraft Pro</title>

<style>
body {
    margin: 0;
    font-family: monospace;
    color: white;
    overflow: hidden;

    background-image: url('/image.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

/* TOP */
#top {
    height: 30vh;
    display: flex;
    justify-content: space-between;
    padding: 30px;
    box-sizing: border-box;
}

.box {
    width: 45%;
}

.smallTitle {
    font-size: 18px;
    opacity: 0.9;
}

.bigText {
    font-size: 48px;
    font-weight: bold;
    margin-top: 10px;
    text-shadow: 3px 3px black;
}

/* BOTTOM */
#bottom {
    height: 70vh;
    background: rgba(0,0,0,0.75);
    padding: 10px;
    overflow: hidden;
}

/* 📜 HISTORIQUE EN COLONNES */
#feed {
    display: flex;
    flex-direction: column;
    flex-wrap: wrap;

    align-content: flex-start;

    height: 100%;
    max-height: calc(19 * 22px);

    gap: 4px;
    font-size: 14px;
}

.line {
    margin: 3px;
    width: 220px;
}

.follow { color: white; }
.sub { color: yellow; }
</style>
</head>

<body>

<div id="top">

    <div class="box">
        <div class="smallTitle">⭐ Dernier Sub</div>
        <div id="lastSub" class="bigText">Aucun</div>
    </div>

    <div class="box">
        <div class="smallTitle">🔵 Dernier Follow</div>
        <div id="lastFollow" class="bigText">Aucun</div>
    </div>

</div>

<div id="bottom">
    <div id="feed"></div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

const feed = document.getElementById("feed");
const lastSub = document.getElementById("lastSub");
const lastFollow = document.getElementById("lastFollow");

// 🔥 derniers pseudos
fetch("/latest")
.then(res => res.json())
.then(data => {
    lastSub.innerText = data.sub;
    lastFollow.innerText = data.follow;
});

// 📜 historique initial
fetch("/history")
.then(res => res.json())
.then(renderHistory);

// 🎮 event live
socket.on("event", data => {

    if (data.type === "sub") lastSub.innerText = data.username;
    if (data.type === "follow") lastFollow.innerText = data.username;

});

// 📜 update historique
socket.on("history", renderHistory);

function renderHistory(data) {

    feed.innerHTML = "";

    data.forEach(event => {

        const div = document.createElement("div");

        div.classList.add("line", event.type);

        div.innerText =
            (event.type === "follow" ? "🔵 " : "⭐ ")
            + event.username;

        feed.appendChild(div);
    });
}

// 🖼️ fond live
socket.on("background", img => {
    document.body.style.backgroundImage = `url(${img})`;
});

// fond initial
fetch("/background")
.then(res => res.json())
.then(data => {
    if (data.image) {
        document.body.style.backgroundImage = `url(${data.image})`;
    }
});
</script>

</body>
</html>
