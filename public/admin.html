<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Admin Overlay</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: white;
    text-align: center;
    padding: 40px;
}

input, button {
    margin: 10px;
    padding: 10px;
}
</style>
</head>

<body>

<h1>⚙️ Admin Overlay</h1>

<!-- FOLLOW -->
<h3>🔵 Follow</h3>
<input id="follow" placeholder="Pseudo follow">
<button onclick="send('follow')">Envoyer</button>

<!-- SUB -->
<h3>⭐ Sub</h3>
<input id="sub" placeholder="Pseudo sub">
<button onclick="send('sub')">Envoyer</button>

<!-- 🖼️ BACKGROUND -->
<h3>🖼️ Fond du site</h3>
<input type="file" id="bgFile">
<button onclick="uploadBg()">Uploader fond</button>

<script>
function send(type) {
    let username = document.getElementById(type).value;

    fetch("/event", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ type, username })
    });
}

// 📤 upload image → base64
function uploadBg() {
    const file = document.getElementById("bgFile").files[0];
    const reader = new FileReader();

    reader.onload = function() {
        fetch("/background", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ image: reader.result })
        });
    };

    reader.readAsDataURL(file);
}
</script>

</body>
</html>
